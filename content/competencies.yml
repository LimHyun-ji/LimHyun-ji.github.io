# ─────────────────────────────────────────────────────────────
# 메인 "어떻게 일하나" — 시스템이 달라도 반복해서 나타나는 일하는 방식을 역량 카드 4장으로 보여 준다.
# 앞면: name(채용에서 쓰는 역량 이름) · headline(한 줄 주장) · proof / proofLabel(대표 증거, 숫자 우선)
# 뒷면(뒤집기): 사례 제목 + 결과 한 줄 + 시스템 링크. situation · decision은 상세 페이지 · 면접 준비용으로 보관.
# 시스템 설명(무엇을 만들었나)은 아래 "담당 시스템"에 있으므로 여기서는 판단만 쓴다.
# slug: 사례가 속한 시스템 상세 페이지 (content/projects/*.md)
# ─────────────────────────────────────────────────────────────

groups:
  - id: root-cause
    name: "근본 원인 디버깅"
    proof: "3개 시스템"
    proofLabel: "UI 입력 · 에디터 뷰 · 전투 연출 버그를 원인에서 수정"
    title: "원인을 고친다"
    headline: "증상을 덮지 않고, 왜 생겼는지까지 내려가 고칩니다"
    cases:
      - title: "TopView에서 메시가 사라짐"
        slug: areatool
        situation: "레벨 툴에서 직교(TopView) 뷰로 바꾸면 배치한 메시가 보이지 않음"
        decision: "컬링 거리를 직교 뷰의 ViewOrigin 기준으로 계산하고 있던 것이 원인임을 확인"
        result: "Perspective일 때의 ViewDistance를 참조하도록 바꿔 뷰 종류와 관계없이 표시"
      - title: "피격 연출과 이펙트의 시점 불일치"
        slug: combat
        situation: "피격 연출이 날아가는 이펙트보다 먼저 또는 늦게 표시됨"
        decision: "지연은 진행 방향 투영 · 등속으로, 이펙트는 속도 커브로 각각 다른 값을 참조하는 게 원인"
        result: "둘이 같은 속성(속도 커브)을 참조하게 해 이펙트가 닿는 순간 피격 표시"
      - title: "월드맵 클릭이 하위 위젯에 전달되지 않음"
        slug: mapdesign
        situation: "일부 위젯에서 클릭이 먹히지 않고, 모바일 · PC 입력 처리가 위젯마다 따로 있음"
        decision: "상위 위젯의 Visibility 설정 때문에 위쪽 위젯이 입력을 먼저 소비하는 것이 원인"
        result: "위젯이 아니라 InputProcessor에서 입력을 한곳으로 받아 모바일 · PC 처리를 단일화"

  - id: prevent
    name: "구조 설계 · 자동화"
    proof: "검증 → CI"
    proofLabel: "레벨 데이터 검증 · Export를 사람 손에서 빌드 단계로"
    title: "재발을 막는다"
    headline: "사람이 조심하는 대신, 같은 문제가 다시 생길 수 없는 구조를 만듭니다"
    cases:
      - title: "잘못된 레벨 데이터 · Export 누락"
        slug: areatool
        situation: "잘못된 레벨 데이터가 Export 후 런타임에서야 발견되고, 사용자가 직접 Export하며 일부 누락"
        decision: "확인 시점을 앞당겨 Export 전에 검증자 체인을 통과하도록 하고, Export 자체를 사람 손에서 뺌"
        result: "CI/CD 빌드 단계에서 검증과 Export를 실행해 누락 · 오류 유입 차단"
      - title: "흩어진 VisualData 소유"
        slug: visualdata
        situation: "여러 객체가 VisualData를 각자 들고 있어 데이터 생명주기가 흩어짐"
        decision: "컴포넌트에는 필요한 데이터만 할당(필요 시 WeakPtr)하고, 생명주기는 모듈 한 곳에서만 관리"
        result: "모듈 생성을 CreateModule Factory로 통일해 새 Entity 타입도 같은 규칙으로 추가"
      - title: "잘못된 기획 데이터의 런타임 유입"
        slug: metadata-pipeline
        situation: "잘못된 값 · 단위 착오가 Excel → JSON 변환을 거쳐 런타임까지 반영"
        decision: "테이블별 Custom Validation Script와 Unit 단위계를 변환 단계에 넣음"
        result: "규칙에 맞지 않는 데이터는 변환 시점에서 차단"

  - id: tradeoff
    name: "성능 트레이드오프"
    proof: "2.11 → 0.67ms"
    proofLabel: "Slate Tick — Global Invalidation 적용 전후"
    title: "비용을 고른다"
    headline: "CPU · GPU · 메모리 · 정밀도 중 무엇을 내줄지 알고 고릅니다"
    cases:
      - title: "Global Invalidation 적용 범위"
        slug: optimization
        situation: "매 프레임 위젯 재계산(Slate Tick) 비용이 큼 — Unreal Insights로 측정"
        decision: "위젯을 캐시하는 대신 갱신 누락 위험을 감수하고, 계속 바뀌는 위젯만 Volatile로 빼 경계를 설계"
        result: "Slate Tick 2.11ms → 0.67ms, 갱신 누락은 필요한 시점에 Invalidate로 보완"
      - title: "갱신이 드문 UI의 그리기 비용"
        slug: optimization
        situation: "거의 바뀌지 않는 UI도 매 프레임 다시 그려 CPU 비용 발생"
        decision: "RetainerBox로 결과를 캐시해 CPU 비용을 GPU 메모리 비용과 맞바꿈"
        result: "갱신 빈도가 낮은 UI에만 적용해 이득이 큰 곳에서만 교환"
      - title: "미니맵 퀘스트 표시 · 모바일 포맷"
        slug: mapdesign
        situation: "퀘스트 아이콘 위젯 비용이 크고, 데이터 텍스처 포맷을 지원하지 않는 모바일 기기 존재"
        decision: "퀘스트 데이터를 Material Parameter로 넘겨 GPU에서 그리고, PF_R32_FLOAT 미지원 기기는 PF_R16F로 정밀도를 낮춤"
        result: "MapOrigin을 -0.5 ~ 0.5로 정규화해 낮춘 정밀도에서도 위치 오차 보완"

  - id: ownership
    name: "변경 책임 · 마이그레이션"
    proof: "3,343개"
    proofLabel: "기존 에셋 무손실 이전 (롤백 2회 후 재서밋)"
    title: "끝까지 간다"
    headline: "내 변경이 만든 문제까지 추적해 마무리합니다"
    cases:
      - title: "VisualData 대규모 구조 변경"
        slug: visualdata-editor
        situation: "하나의 슈퍼클래스에 모여 있던 타입별 데이터를 분리하면서 기존 에셋을 모두 옮겨야 함"
        decision: "병합 과정의 크래시로 두 번 롤백한 뒤 원인을 고쳐 재서밋, Asset Migration 툴로 일괄 변환"
        result: "기존 에셋 3,343개를 손실 없이 새 타입으로 이전"
      - title: "ListView 전환 뒤 생긴 연출 중복"
        slug: sol-content
        situation: "아이템 컬렉션을 ListView 가상화로 바꾼 뒤 완료 연출이 겹쳐 재생"
        decision: "재활용되는 위젯이 이전 데이터의 이벤트 구독을 유지하던 것을 찾아냄"
        result: "재활용 시점에 구독을 해제하고, 완료 연출은 한 번만 실행되도록 멱등 처리"
      - title: "풀링 도입 뒤 생긴 컴포넌트 누수"
        slug: sol-content
        situation: "획득 연출에 풀링을 적용한 뒤 Niagara 컴포넌트가 계속 늘어남"
        decision: "순회 중 삭제한 항목이 지연 콜백 시점에 풀로 돌아가지 못하는 생명주기 불일치를 추적"
        result: "반환 대상을 따로 모아 지연 반환하고, EndPlay에서 컴포넌트를 파괴"

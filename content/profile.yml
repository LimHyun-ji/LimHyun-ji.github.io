intro: >
  Unreal Engine 5(C++) 기반 MMORPG 클라이언트 개발자입니다.
  전투/액션 데이터와 결합해 각 캐릭터에 외형을 세팅·로드하는 VisualData 캐릭터 비주얼 데이터 시스템을 핵심으로 담당하고,
  길드·별자리·순례·수집 등 다수의 콘텐츠 시스템을 여러 해에 걸쳐 반복 소유하며 설계 → 구현 → 리팩토링 → 라이브 운영 전 주기를 책임졌습니다.
  RenderTarget·SceneCapture·LevelSequence 기반 인게임 연출 렌더링과 UI·메모리·틱 최적화까지,
  엔진 표준 패턴을 이해하고 그 위에 모바일용 보강을 설계하는 방식으로 일합니다.


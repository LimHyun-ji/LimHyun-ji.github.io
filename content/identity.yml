# ─────────────────────────────────────────────────────────────
# 정체성 문구 + 연도별 "문제 → 넓어진 영역" (메인 히어로·경력 카드에 표시)
# profile.yml과 분리해 둔 파일입니다.
# ─────────────────────────────────────────────────────────────

# 히어로 메인 문구
tagline: "구조적 문제를 해결하며 영역을 넓혀온 개발자"

# 경력 섹션 상단 한 줄 설명
growthIntro: >
  흩어진 외형 데이터는 타입별 모듈 구조로, 런타임까지 새던 데이터 오류는 검증 파이프라인으로,
  엉킨 에디터 슈퍼클래스는 타입 분리와 자동 이전으로 — 반복되는 문제를 구조부터 바로잡으며
  시스템 · 툴 · 최적화로 맡는 영역을 넓혀왔습니다.

# 경력 카드별 "부딪힌 문제 → 넓어진 영역" (period 값이 profile.yml experience의 period와 같아야 표시됨)
growth:
  - period: "2023"
    area: "데이터 파이프라인 · 신규 시스템 컨텐츠"
  - period: "2024"
    area: "렌더링 · 에셋 수명 관리"
  - period: "2025"
    area: "성능 · 메모리 최적화 · 에디터 툴링"
  - period: "2026"
    area: "라이브 고도화·전투 컨텐츠"

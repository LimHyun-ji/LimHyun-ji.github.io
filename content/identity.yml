# ─────────────────────────────────────────────────────────────
# 정체성 문구 + 연도별 "문제 → 넓어진 영역" (메인 히어로·경력 카드에 표시)
# profile.yml과 분리해 둔 파일입니다.
# ─────────────────────────────────────────────────────────────

# 히어로 메인 문구
tagline: "문제를 해결하며 영역을 넓혀온 개발자"

# 경력 섹션 상단 한 줄 설명
growthIntro: >
  데이터 오류를 막다 툴과 CI로, 모바일 프레임 비용을 줄이다 렌더링과 UI 최적화로,
  라이브 크래시를 추적하다 엔진의 수명 관리까지 — 부딪힌 문제를 끝까지 따라가며 맡는 영역을 넓혀왔습니다.

# 경력 카드별 "부딪힌 문제 → 넓어진 영역" (period 값이 profile.yml experience의 period와 같아야 표시됨)
growth:
  - period: "2023"
    problem: "기획 데이터의 잘못된 값 · 형식이 런타임까지 유입"
    area: "툴 · 데이터 파이프라인"
  - period: "2024"
    problem: "연출 자원이 상시 메모리·GPU를 점유"
    area: "렌더링 · 에셋 수명 관리"
  - period: "2025"
    problem: "모바일 UI 재계산·메모리 스파이크, 에디터 구조 부채"
    area: "성능 · 메모리 최적화"
  - period: "2026 상반기"
    problem: "재현되지 않는 라이브 크래시"
    area: "엔진 오브젝트 수명 · 디버깅"

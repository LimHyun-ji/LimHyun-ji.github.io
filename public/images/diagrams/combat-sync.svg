<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 576" width="860" height="576" font-family="Inter, 'Malgun Gothic', sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7787a2"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="575" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="20" y="30" font-size="14" font-weight="700" fill="#0f172a">전투 서버 동기화 — 판정 시점 시퀀스</text>
<line x1="230" y1="90" x2="230" y2="552" stroke="#e2e8f0" stroke-width="1.3" stroke-dasharray="4 5"/>
<rect x="160" y="52" width="140" height="38" rx="8" fill="#dbe9ff" stroke="#3b6fb0" stroke-width="1.5"/>
<text x="230" y="75.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">CLIENT</text>
<line x1="630" y1="90" x2="630" y2="552" stroke="#e2e8f0" stroke-width="1.3" stroke-dasharray="4 5"/>
<rect x="560" y="52" width="140" height="38" rx="8" fill="#dbe9ff" stroke="#3b6fb0" stroke-width="1.5"/>
<text x="630" y="75.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">SERVER</text>
<rect x="50" y="222" width="360" height="32" rx="7" fill="#eef2f7" stroke="#64748b" stroke-width="1.2"/>
<text x="62" y="242.0" font-size="11" fill="#1e293b">CLIENT: ActionQueue → 몽타주 재생 (SyncGameTime 기준)</text>
<rect x="50" y="262" width="360" height="26" rx="7" fill="#fff7e6" stroke="#d9a12b" stroke-width="1.2"/>
<text x="62" y="279.0" font-size="11" fill="#1e293b">Hit_0 (Immediate) → 즉시 데미지 적용</text>
<rect x="50" y="294" width="360" height="26" rx="7" fill="#fff7e6" stroke="#d9a12b" stroke-width="1.2"/>
<text x="62" y="311.0" font-size="11" fill="#1e293b">Hit_1 (Lazy) → 서버 확인 대기</text>
<rect x="50" y="326" width="360" height="26" rx="7" fill="#fff7e6" stroke="#d9a12b" stroke-width="1.2"/>
<text x="62" y="343.0" font-size="11" fill="#1e293b">Hit_2 (Immediate) → 즉시 데미지 적용</text>
<rect x="50" y="408" width="360" height="30" rx="7" fill="#fff7e6" stroke="#d9a12b" stroke-width="1.2"/>
<text x="62" y="427.0" font-size="11" fill="#1e293b">CLIENT: Hit_1 Lazy 데미지 적용</text>
<line x1="230" y1="122" x2="630" y2="122" stroke="#7787a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="115" text-anchor="middle" font-size="10.5" fill="#475569">1. CastCmd (skill_id, target_id)</text>
<line x1="630" y1="160" x2="230" y2="160" stroke="#7787a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="153" text-anchor="middle" font-size="10.5" fill="#475569">2. SkillCastResultEvt (Success)</text>
<line x1="630" y1="198" x2="230" y2="198" stroke="#7787a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="191" text-anchor="middle" font-size="10.5" fill="#475569">3. ActionEvt (NotifyInfoList 포함)</text>
<line x1="630" y1="386" x2="230" y2="386" stroke="#7787a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="379" text-anchor="middle" font-size="10.5" fill="#475569">4. LazyHitNotifyEvt (Hit_1 데미지)</text>
<line x1="630" y1="480" x2="230" y2="480" stroke="#7787a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="473" text-anchor="middle" font-size="10.5" fill="#475569">5. ChangeStatusEffectEvt (버프 / 디버프 / CC)</text>
<line x1="630" y1="518" x2="230" y2="518" stroke="#7787a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="511" text-anchor="middle" font-size="10.5" fill="#475569">6. AttackEndEvt (스킬 처리 완료)</text>
<rect x="450" y="222" width="360" height="130" rx="12" fill="#fff1e6" stroke="#e8823a" stroke-width="1.5"/>
<text x="630.0" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8823a">시간 동기화 모델</text>
<text x="466" y="272" font-size="11" font-weight="600" fill="#1e293b">SyncGameTime = ServerTime − (RTT/2 + 200ms)</text>
<text x="466" y="293" font-size="11" fill="#1e293b">• 200ms 고정 버퍼로 네트워크 지연 흡수</text>
<text x="466" y="314" font-size="11" fill="#1e293b">• RTT 변화 25ms 이상일 때만 갱신 (히스테리시스)</text>
<text x="466" y="335" font-size="11" fill="#1e293b">• 지연 초과 시 이벤트 즉시 실행</text>
<rect x="248.5" y="542" width="14" height="14" rx="3" fill="#eef2f7" stroke="#64748b"/>
<text x="268.5" y="554" font-size="10.5" fill="#475569">클라이언트 내부 처리</text>
<rect x="406.6" y="542" width="14" height="14" rx="3" fill="#fff7e6" stroke="#d9a12b"/>
<text x="426.6" y="554" font-size="10.5" fill="#475569">히트 판정 처리</text>
<rect x="533.2" y="542" width="14" height="14" rx="3" fill="#fff1e6" stroke="#e8823a"/>
<text x="553.2" y="554" font-size="10.5" fill="#475569">시간 동기화</text>
</svg>
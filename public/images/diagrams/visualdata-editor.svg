<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Inter, 'Malgun Gothic', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7787a2"/></marker>
</defs>
<!-- 배경 -->
<rect x="0.5" y="0.5" width="879" height="429" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<!-- 제목 -->
<text x="20" y="30" font-size="14" font-weight="700" fill="#0f172a">VisualData 에디터 구조 — FVisualDataEditor (FPersonaAssetEditorToolkit 확장)</text>

<!-- 최상단: FVisualDataEditor -->
<rect x="200" y="50" width="480" height="54" rx="9" fill="#dbe9ff" stroke="#3b6fb0" stroke-width="1.5"/>
<text x="440" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">FVisualDataEditor</text>
<text x="440" y="92" text-anchor="middle" font-size="11" fill="#475569">FPersonaAssetEditorToolkit 확장 · UVisualDataAsset 편집</text>

<!-- 탭 박스들 (4개) -->
<!-- Preview Tab -->
<rect x="20" y="158" width="185" height="50" rx="8" fill="#dbe9ff" stroke="#3b6fb0" stroke-width="1.5"/>
<text x="112" y="179" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Preview Tab</text>
<text x="112" y="197" text-anchor="middle" font-size="10.5" fill="#475569">스켈레탈 메시 뷰포트</text>

<!-- Action Table Tab -->
<rect x="225" y="158" width="190" height="50" rx="8" fill="#dbe9ff" stroke="#3b6fb0" stroke-width="1.5"/>
<text x="320" y="179" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Action Table Tab</text>
<text x="320" y="197" text-anchor="middle" font-size="10.5" fill="#475569">액션 목록 편집 · 속성 설정</text>

<!-- Property Tab -->
<rect x="435" y="158" width="185" height="50" rx="8" fill="#dbe9ff" stroke="#3b6fb0" stroke-width="1.5"/>
<text x="527" y="179" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Property Tab</text>
<text x="527" y="197" text-anchor="middle" font-size="10.5" fill="#475569">세부 속성 인스펙터</text>

<!-- Outliner Tab -->
<rect x="640" y="158" width="220" height="50" rx="8" fill="#dbe9ff" stroke="#3b6fb0" stroke-width="1.5"/>
<text x="750" y="179" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Outliner Tab</text>
<text x="750" y="197" text-anchor="middle" font-size="10.5" fill="#475569">노드 트리 구조 표시</text>

<!-- FVisualDataEditor → 탭들 분기 화살표 -->
<line x1="440" y1="104" x2="440" y2="130" stroke="#7787a2" stroke-width="1.3"/>
<line x1="112" y1="130" x2="750" y2="130" stroke="#7787a2" stroke-width="1.3"/>
<line x1="112" y1="130" x2="112" y2="156" stroke="#7787a2" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="320" y1="130" x2="320" y2="156" stroke="#7787a2" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="527" y1="130" x2="527" y2="156" stroke="#7787a2" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="750" y1="130" x2="750" y2="156" stroke="#7787a2" stroke-width="1.3" marker-end="url(#arrow)"/>

<!-- 하단 좌: UVisualDataEditorSubsystem -->
<rect x="20" y="278" width="390" height="70" rx="9" fill="#e8f1ff" stroke="#4a80c8" stroke-width="1.5"/>
<text x="215" y="302" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">UVisualDataEditorSubsystem</text>
<text x="215" y="320" text-anchor="middle" font-size="11" fill="#475569">Asset 프리뷰 · Validation 검증</text>
<text x="215" y="337" text-anchor="middle" font-size="11" fill="#475569">Export (JSON 직렬화)</text>

<!-- 하단 우: Visual PlayMode -->
<rect x="470" y="278" width="390" height="70" rx="9" fill="#e8f1ff" stroke="#4a80c8" stroke-width="1.5"/>
<text x="665" y="302" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Visual PlayMode</text>
<text x="665" y="320" text-anchor="middle" font-size="11" fill="#475569">서버 없이 FX · 몽타주 인게임 확인</text>
<text x="665" y="337" text-anchor="middle" font-size="11" fill="#475569">에디터 내 독립 재생 환경</text>

<!-- 탭 → 서브시스템 연결 -->
<line x1="215" y1="208" x2="215" y2="276" stroke="#7787a2" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="527" y1="208" x2="527" y2="260" stroke="#7787a2" stroke-width="1.3" stroke-dasharray="5 4"/>
<line x1="527" y1="260" x2="665" y2="260" stroke="#7787a2" stroke-width="1.3" stroke-dasharray="5 4"/>
<line x1="665" y1="260" x2="665" y2="276" stroke="#7787a2" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<!-- 라벨 -->
<text x="170" y="248" text-anchor="middle" font-size="10" fill="#475569">에셋 조작</text>
<text x="596" y="254" text-anchor="middle" font-size="10" fill="#475569">PlayMode 연동</text>

<!-- Export 플로우 -->
<rect x="160" y="390" width="560" height="32" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="440" y="410" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Export → JSON 직렬화 → 서버 동기화 (게임 데이터 반영)</text>

<!-- 서브시스템 → Export 화살표 -->
<line x1="215" y1="348" x2="215" y2="375" stroke="#7787a2" stroke-width="1.3"/>
<line x1="215" y1="375" x2="440" y2="375" stroke="#7787a2" stroke-width="1.3"/>
<line x1="440" y1="375" x2="440" y2="388" stroke="#7787a2" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="328" y="370" text-anchor="middle" font-size="10" fill="#475569">Export 실행</text>
</svg>

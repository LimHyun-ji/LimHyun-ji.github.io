<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" font-family="Pretendard, 'Malgun Gothic', sans-serif"><defs><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7A42"/></marker><marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6700"/></marker><marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B24A22"/></marker><marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6A9E"/></marker><marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26312b"/></marker><marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7570"/></marker></defs><rect x="20.0" y="20.0" width="150.0" height="56.0" rx="8" fill="#f3f5f4" stroke="#d5ddd8" stroke-width="1.2"/><text x="95.0" y="45.0" font-size="14.5" fill="#26312b" font-weight="700" text-anchor="middle">활성 화면 전환</text><text x="95.0" y="62.0" font-size="12.5" fill="#6b7570" font-weight="500" text-anchor="middle">ScreenStack</text><line x1="170.0" y1="48.0" x2="196.0" y2="48.0" stroke="#26312b" stroke-width="1.6" marker-end="url(#ah-k)"/><rect x="200.0" y="20.0" width="150.0" height="56.0" rx="8" fill="#e8f0f8" stroke="#2F6A9E" stroke-width="1.2"/><text x="275.0" y="45.0" font-size="14.5" fill="#2F6A9E" font-weight="700" text-anchor="middle">화면 데이터</text><text x="275.0" y="62.0" font-size="12.5" fill="#6b7570" font-weight="500" text-anchor="middle">UseGlobalInvalidation</text><line x1="350.0" y1="48.0" x2="376.0" y2="48.0" stroke="#26312b" stroke-width="1.6" marker-end="url(#ah-k)"/><rect x="380.0" y="20.0" width="140.0" height="56.0" rx="8" fill="#e8f5ee" stroke="#22A862" stroke-width="1.2"/><text x="450.0" y="45.0" font-size="14.5" fill="#0F7A42" font-weight="700" text-anchor="middle">Toggle</text><text x="450.0" y="62.0" font-size="12.5" fill="#6b7570" font-weight="500" text-anchor="middle">Global Invalidation</text><text x="20.0" y="106.0" font-size="13.5" fill="#0F7A42" font-weight="700" text-anchor="start">바뀌지 않은 위젯은 캐시 → 매 프레임 재계산 제거</text><rect x="20.0" y="120.0" width="245.0" height="104.0" rx="8" fill="#fdeee6" stroke="#F7845A" stroke-width="1.2"/><text x="32.0" y="142.0" font-size="13.5" fill="#B24A22" font-weight="800" text-anchor="start">부작용 1 · 2</text><text x="32.0" y="164.0" font-size="12.5" fill="#26312b" font-weight="600" text-anchor="start">계속 바뀌는 위젯 → ForceVolatile</text><text x="32.0" y="184.0" font-size="12.5" fill="#26312b" font-weight="600" text-anchor="start">경로 밖 값 변경 → 2틱 뒤 갱신</text><text x="32.0" y="204.0" font-size="12.5" fill="#26312b" font-weight="600" text-anchor="start">재접속 → InvalidateAllWidget</text><rect x="275.0" y="120.0" width="245.0" height="104.0" rx="8" fill="#f3f5f4" stroke="#d5ddd8" stroke-width="1.2"/><text x="287.0" y="142.0" font-size="13.5" fill="#6b7570" font-weight="800" text-anchor="start">한계</text><text x="287.0" y="164.0" font-size="12.5" fill="#26312b" font-weight="600" text-anchor="start">갱신이 잦은 화면은</text><text x="287.0" y="184.0" font-size="12.5" fill="#26312b" font-weight="600" text-anchor="start">화면 단위로 꺼서</text><text x="287.0" y="204.0" font-size="12.5" fill="#26312b" font-weight="600" text-anchor="start">적용 범위를 제한</text></svg>
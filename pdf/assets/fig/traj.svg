 font-weight="800" text-anchor="start">R</text><path d="M130,138 C220,33.0 350,101.5 470,140" stroke="#0F7A42" stroke-width="1.8" fill="none" opacity="0.85"/><path d="M130,138 C220,81.0 350,126.7 470,140" stroke="#0F7A42" stroke-width="1.8" fill="none" opacity="0.85"/><path d="M130,138 C220,207.0 350,158.4 470,140" stroke="#0F7A42" stroke-width="1.8" fill="none" opacity="0.85"/><path d="M130,138 C220,255.0 350,186.8 470,140" stroke="#0F7A42" stroke-width="1.8" fill="none" opacity="0.85"/><path d="M130,138 C220,126.0 350,138.4 470,140" stroke="#0F7A42" stroke-width="1.8" fill="none" opacity="0.85"/><circle cx="470.0" cy="140.0" r="9.0" fill="#e8f5ee" stroke="#0F7A42" stroke-width="2"/><text x="470.0" y="168.0" font-size="13.5" fill="#0F7A42" font-weight="700" text-anchor="middle">Player</text><circle cx="130.0" cy="138.0" r="5.0" fill="#26312b" stroke="#26312b" stroke-width="1.6"/><text x="100.0" y="134.0" font-size="13" fill="#26312b" font-weight="700" text-anchor="end">Target</text><text x="100.0" y="150.0" font-size="12" fill="#6b7570" font-weight="600" text-anchor="end">(피격자)</text><text x="232.0" y="32.0" font-size="14" fill="#26312b" font-weight="800" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">dir = normalize(R · a + U · b)</text><text x="232.0" y="52.0" font-size="13" fill="#6b7570" font-weight="600" text-anchor="start">랜덤 가중치 a, b → 평면 위 무작위 확산</text><text x="232.0" y="238.0" font-size="13" fill="#0F7A42" font-weight="700" text-anchor="start">가속 누적 → 랜덤 성분 감소 → 목표로 수렴</text><text x="232.0" y="256.0" font-size="13" fill="#6b7570" font-weight="600" text-anchor="start">먼 대상일수록 초기 확산 크게 (거리 보간)</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 572 302" width="572" height="302" font-family="Pretendard, 'Malgun Gothic', sans-serif"><defs><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7A42"/></marker><marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6700"/></marker><marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B24A22"/></marker><marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6A9E"/></marker><marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26312b"/></marker><marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7570"/></marker></defs><rect x="-16" y="-16" width="572" height="302" rx="14" fill="#ffffff"/><polygon points="20.4,116.4 188.5,41.6 235.6,147.6 67.5,222.4" fill="#e8f0f8" stroke="#2F6A9E" stroke-width="1.6"/><text x="128.0" y="30.0" font-size="13.5" fill="#2F6A9E" font-weight="700" text-anchor="middle">부모 위젯: 회전 θ + 비균일 스케일</text><circle cx="67.5" cy="143.6" r="4.5" fill="#F7845A" stroke="#fff" stroke-width="1.2"/><circle cx="91.5" cy="148.3" r="4.5" fill="#F7845A" stroke="#fff" stroke-width="1.2"/><circle cx="115.4" cy="152.9" r="4.5" fill="#F7845A" stroke="#fff" stroke-width="1.2"/><circle cx="122.3" cy="119.2" r="4.5" fill="#F7845A" stroke="#fff" stroke-width="1.2"/><circle cx="146.3" cy="123.9" r="4.5" fill="#F7845A" stroke="#fff" stroke-width="1.2"/><circle cx="170.2" cy="128.5" r="4.5" fill="#F7845A" stroke="#fff" stroke-width="1.2"/><circle cx="177.1" cy="94.8" r="4.5" fill="#F7845A" stroke="#fff" stroke-width="1.2"/><line x1="128.0" y1="132.0" x2="239.5" y2="82.4" stroke="#2F6A9E" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah-b)"/><text x="198.0" y="184.0" font-size="16" fill="#2F6A9E" font-weight="800" text-anchor="start">θ</text><text x="128.0" y="238.0" font-size="13" fill="#6b7570" font-weight="600" text-anchor="middle">파티클이 부모 회전 · 스케일을 그대로 따라가야 함</text><rect x="268.0" y="44.0" width="262.0" height="70.0" rx="8" fill="#fdeee6" stroke="#F7845A" stroke-width="1.2"/><text x="280.0" y="66.0" font-size="13.5" fill="#B24A22" font-weight="800" text-anchor="start">✗ 기존</text><text x="280.0" y="86.0" font-size="13.5" fill="#26312b" font-weight="600" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">cos θ = A / √(B² + D²)</text><text x="280.0" y="104.0" font-size="12.5" fill="#6b7570" font-weight="600" text-anchor="start">비균일 스케일에서 틀림 · 1 초과 시 NaN</text><rect x="268.0" y="128.0" width="262.0" height="92.0" rx="8" fill="#e8f5ee" stroke="#22A862" stroke-width="1.2"/><text x="280.0" y="150.0" font-size="13.5" fill="#0F7A42" font-weight="800" text-anchor="start">✓ 수정</text><text x="280.0" y="170.0" font-size="13" fill="#26312b" font-weight="600" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">M = [A B; C D] → θ = atan2(B, A)</text><text x="280.0" y="190.0" font-size="13.5" fill="#26312b" font-weight="600" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">p' = R(θ) · (S · p)</text><text x="280.0" y="209.0" font-size="12.5" fill="#6b7570" font-weight="600" text-anchor="start">스케일을 먼저, 회전은 나중에</text></svg>
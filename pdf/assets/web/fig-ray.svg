<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 572 328" width="572" height="328" font-family="Pretendard, 'Malgun Gothic', sans-serif"><defs><marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7A42"/></marker><marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6700"/></marker><marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B24A22"/></marker><marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6A9E"/></marker><marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26312b"/></marker><marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7570"/></marker></defs><rect x="-16" y="-16" width="572" height="328" rx="14" fill="#ffffff"/><polygon points="140,222 250,160 490,200 330,266" fill="#fff7e0" stroke="#F5C000" stroke-width="1.6"/><text x="250.0" y="236.0" font-size="13" fill="#8A6700" font-weight="700" text-anchor="middle">Territory 폴리곤</text><line x1="250.0" y1="160.0" x2="490.0" y2="200.0" stroke="#B24A22" stroke-width="3"/><text x="242.0" y="154.0" font-size="15" fill="#B24A22" font-weight="800" text-anchor="end">P</text><text x="496.0" y="216.0" font-size="15" fill="#B24A22" font-weight="800" text-anchor="start">Q</text><text x="440.0" y="224.0" font-size="13.5" fill="#B24A22" font-weight="700" text-anchor="middle">e = Q − P</text><rect x="87.5" y="54.2" width="44.0" height="52.0" rx="4" fill="#fff" stroke="#6b7570" stroke-width="1.2" stroke-dasharray="3 3"/><text x="109.5" y="48.2" font-size="12.5" fill="#6b7570" font-weight="600" text-anchor="middle">화면</text><line x1="36.0" y1="52.0" x2="370.0" y2="180.0" stroke="#2F6A9E" stroke-width="2" marker-end="url(#ah-b)"/><circle cx="36.0" cy="52.0" r="6.0" fill="#2F6A9E" stroke="#fff" stroke-width="2"/><text x="32.0" y="40.0" font-size="13.5" fill="#2F6A9E" font-weight="700" text-anchor="start">O (카메라)</text><circle cx="109.5" cy="80.2" r="4.0" fill="#fff" stroke="#2F6A9E" stroke-width="2"/><text x="135.5" y="84.2" font-size="12.5" fill="#2F6A9E" font-weight="600" text-anchor="start">클릭 → Deproject</text><text x="106.0" y="106.0" font-size="15" fill="#2F6A9E" font-weight="800" text-anchor="start">d</text><circle cx="370.0" cy="180.0" r="7.0" fill="#0F7A42" stroke="#fff" stroke-width="2.4"/><text x="382.0" y="168.0" font-size="14" fill="#0F7A42" font-weight="800" text-anchor="start">X = O + t · d</text><text x="330.0" y="286.0" font-size="13" fill="#0F7A42" font-weight="700" text-anchor="middle">→ X를 로컬 좌표로 바꿔 P, Q 사이에 삽입</text><text x="300.0" y="30.0" font-size="13.5" fill="#26312b" font-weight="600" text-anchor="start">① n = d × e ≈ 0 → 평행, 제외</text><text x="300.0" y="50.0" font-size="13.5" fill="#26312b" font-weight="600" text-anchor="start">② (P − O) · n ≈ 0 → 동일 평면</text><text x="300.0" y="70.0" font-size="13.5" fill="#26312b" font-weight="600" text-anchor="start">③ t, s ∈ [0, 1] → 실제 교차</text><text x="300.0" y="92.0" font-size="12.5" fill="#6b7570" font-weight="600" text-anchor="start">교차점은 로컬 좌표로 바꿔 저장</text></svg>